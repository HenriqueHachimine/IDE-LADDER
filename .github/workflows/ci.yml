name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      LADDER_REQUIRE_C: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - run: python scripts/gen_isa_header.py --check
      - run: python -m pytest -q
        working-directory: desktop
