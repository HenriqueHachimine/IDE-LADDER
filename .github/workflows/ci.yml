name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sem-assinatura-de-ia:
    # Regra do projeto (CONTRIBUTING): nada de assinatura de ferramentas de IA no repositorio,
    # nem nas mensagens de commit nem nos arquivos. O padrao c[l]aude evita citar o nome aqui.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Mensagens de commit
        run: |
          if git log --format='%H %B' | grep -inE 'c[l]aude|co-authored-by:.*@anthropic\.com'; then
            echo "::error::Mensagem de commit com assinatura de ferramenta de IA (ver CONTRIBUTING.md)"
            exit 1
          fi
      - name: Arquivos
        run: |
          if git grep -nIiE 'c[l]aude'; then
            echo "::error::Arquivo com mencao a ferramenta de IA (ver CONTRIBUTING.md)"
            exit 1
          fi

  desktop-and-core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      LADDER_REQUIRE_C: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bibliotecas de sistema do Qt (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: python -m pip install -e "desktop[gui,comm,dev]"
      - run: python scripts/gen_isa_header.py --check
      - run: python -m pytest -q
        working-directory: desktop

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install platformio
      - run: pio run
        working-directory: firmware
