[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ladderide"
version = "0.9.0"
description = "IDE LADDER para CLP com ESP32: editor, compilador, simulador, transferencia e monitor"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
# O nucleo (core, model, compiler, sim) nao tem dependencias externas.
gui = ["PySide6>=6.6"]
comm = ["pyserial>=3.5"]
dev = ["pytest>=8"]

[project.scripts]
ladderide-cli = "ladderide.cli:main"

[project.gui-scripts]
ladderide = "ladderide.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
