; Firmware CLP LADDER - ESP32 8 reles
; Compilar:  pio run          Gravar:  pio run -t upload --upload-port COM5

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200
upload_speed = 460800
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -Wall
build_src_filter = +<*>
; lib/ladder_vm e lib/plc_core sao bibliotecas locais em C99 (tambem compiladas no PC pelos testes)
