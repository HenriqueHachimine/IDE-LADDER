; Firmware CLP LADDER - ESP32 8 reles
; Compilar:  pio run          Gravar:  pio run -t upload --upload-port COM5
; Exemplos (examples/README.md):  pio run -e exemplo_teste_placa | pio run -e exemplo_ladder_portao

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200
upload_speed = 460800
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -Wall
build_src_filter = +<*>
; lib/ladder_vm e lib/plc_core sao bibliotecas locais em C99 (tambem compiladas no PC pelos testes)

; ---------------------------------------------------------------- exemplos
; Programas independentes que substituem o firmware do CLP na placa. Usam as
; mesmas E/S (src/io_board.cpp) e a mesma configuracao (src/board_config.h).

[env:exemplo_teste_placa]
extends = env:esp32dev
build_src_filter = -<*> +<io_board.cpp> +<../examples/teste_placa/>

[env:exemplo_ladder_portao]
extends = env:esp32dev
build_src_filter = -<*> +<io_board.cpp> +<../examples/ladder_portao/>
